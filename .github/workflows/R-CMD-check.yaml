# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Besides the usual matrix this runs two jobs aimed at the specific platforms
# that broke hdf5r on CRAN:
#
#   * linux-arm64 - plain `char` is unsigned there, which changes which HDF5
#     native type H5T_NATIVE_CHAR resolves to.
#   * HDF5 2.x    - upstream removed symbols the generated wrappers used.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # SystemRequirements only names "HDF5", so install it explicitly rather
      # than relying on the sysreqs mapping resolving on every runner image.
      - name: Install HDF5 (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5

      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Report HDF5 version
        if: runner.os != 'Windows'
        run: h5cc -showconfig | grep -i "HDF5 Version" || true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # ---------------------------------------------------------------------------
  # linux-arm64. Uses the distro's R rather than r-lib/actions/setup-r, which
  # relies on static pak/R builds that are not guaranteed for aarch64 Linux.
  # ---------------------------------------------------------------------------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    name: ubuntu-24.04-arm (distro R)

    env:
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6

      - name: Install R, HDF5 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-dev libhdf5-dev \
            r-cran-r6 r-cran-bit64 r-cran-testthat r-cran-knitr r-cran-rmarkdown

      - name: Report environment
        run: |
          R --version | head -1
          h5cc -showconfig | grep -i "HDF5 Version"
          dpkg --print-architecture
          printf 'int main(void){return 0;}\n' > /tmp/probe.c
          gcc -dM -E /tmp/probe.c | grep __CHAR_UNSIGNED__ \
            && echo "plain char is UNSIGNED on this target" \
            || echo "plain char is signed on this target"

      - name: Build and check
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --ignore-vignettes hdf5r_*.tar.gz

      - name: Show testthat output
        if: always()
        run: find . -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-results
          path: '*.Rcheck'

  # ---------------------------------------------------------------------------
  # HDF5 2.x. Debian unstable is what the failing CRAN flavours build against.
  # ---------------------------------------------------------------------------
  hdf5-2x:
    runs-on: ubuntu-latest
    container: debian:unstable
    name: debian-unstable (HDF5 2.x)

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install R, HDF5 and dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            r-base-dev libhdf5-dev \
            r-cran-r6 r-cran-bit64 r-cran-testthat r-cran-knitr r-cran-rmarkdown

      - name: Report environment
        run: |
          R --version | head -1
          gcc --version | head -1
          h5cc -showconfig | grep -i "HDF5 Version"

      - name: Build and check
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --ignore-vignettes hdf5r_*.tar.gz

      - name: Show testthat output
        if: always()
        run: find . -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-2x-results
          path: '*.Rcheck'
